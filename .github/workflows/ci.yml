name: Python CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  release:
    types: [published]

# Releases: Python is tagged `v*` and R `r-v*` (see RELEASING.md). Every job below is skipped for an
# R release, so only a `v*` release builds and publishes to PyPI.
#
# The Python package lives in python/. Its tests also read the shared spec/ and fixtures/r/
# directories at the repo root, so the whole repo is checked out.
defaults:
  run:
    working-directory: python

jobs:
  lint:
    name: Python lint
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # setuptools_scm needs full history/tags
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check greenwood tests
      - name: Ruff format check
        run: ruff format --check greenwood tests
      - name: Pyright
        run: pyright greenwood

  test:
    name: Python test (${{ matrix.os }}, ${{ matrix.python-version }})
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run tests
        # The R-parity suite compares against checked-in fixtures, so it needs no
        # R toolchain here; R is only used offline to regenerate those fixtures.
        run: pytest tests -n auto

  parity:
    name: Python parity (Numba, scikit-survival)
    if: github.event_name != 'release' || startsWith(github.event.release.tag_name, 'v')
    # Optional cross-checks that need heavier, less-portable extras: Numba (accelerated
    # split kernel) and scikit-survival (GPL, Python >= 3.11 only), so this runs on a
    # single well-supported interpreter rather than the full matrix. The relevant tests
    # skip gracefully when these packages are absent elsewhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e ".[dev,parity]"
      - name: Run Numba and scikit-survival parity tests
        run: pytest tests/test_forest_rsf.py tests/test_boosting.py tests/test_forest_sksurv_parity.py -n auto

  build:
    name: Build Python distribution
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the version matches the tag
        # setuptools_scm derives the version from the tag, so a mismatch means the tag isn't a
        # valid Python release tag (for example `v1.0-final`).
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          pip install "setuptools_scm>=9"
          version="$(python -m setuptools_scm)"
          if [ "$version" != "${TAG#v}" ]; then
            echo "::error::Tag $TAG gives version $version, expected ${TAG#v}."
            exit 1
          fi
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build --sdist --wheel
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v')
    environment:
      name: pypi
      url: https://pypi.org/project/greenwood/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
