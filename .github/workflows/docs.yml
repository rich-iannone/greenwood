name: Python Docs

# Path filters: a workflow runs only when files it depends on change. The docs site is built from
# python/ plus the shared community files linked into it. main has no required status checks, so a
# skipped workflow can't block a PR. If checks become required, replace these filters with an
# always-running gate job.
on:
  push:
    branches:
      - main
    paths:
      - "python/**"
      - "CITATION.cff"
      - ".github/CONTRIBUTING.md"
      - ".github/CODE_OF_CONDUCT.md"
      - ".github/SECURITY.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "python/**"
      - "CITATION.cff"
      - ".github/CONTRIBUTING.md"
      - ".github/CODE_OF_CONDUCT.md"
      - ".github/SECURITY.md"
      - ".github/workflows/docs.yml"
  # Run by hand to refresh the site, for example the changelog page after a release.
  workflow_dispatch:

jobs:
  build-docs:
    name: "Build Python docs"
    runs-on: ubuntu-latest
    # The Great Docs project (pyproject.toml, great-docs.yml, user_guide/) lives in python/.
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for accurate page timestamps
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"
          python -m pip install git+https://github.com/posit-dev/great-docs.git@main
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      - name: Build docs
        run: great-docs build
      - name: Save docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: python/great-docs/_site
          include-hidden-files: true

  publish-docs:
    name: "Publish Python docs"
    runs-on: ubuntu-latest
    needs: "build-docs"
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: docs-html
          path: great-docs/_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: great-docs/_site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
