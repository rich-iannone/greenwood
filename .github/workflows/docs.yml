name: Docs

# One GitHub Pages site serves both packages: the Great Docs site from python/ at the root and the
# pkgdown site from r/ under r/. A deployment replaces the whole site, so a change to either package
# rebuilds both.
#
# Path filters: a workflow runs only when files it depends on change. The site is built from
# python/ and r/ plus the shared community files linked into it. main has no required status checks,
# so a skipped workflow can't block a PR. If checks become required, replace these filters with an
# always-running gate job.
on:
  push:
    branches:
      - main
    paths:
      - "python/**"
      - "r/**"
      - "CITATION.cff"
      - ".github/CONTRIBUTING.md"
      - ".github/CODE_OF_CONDUCT.md"
      - ".github/SECURITY.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "python/**"
      - "r/**"
      - "CITATION.cff"
      - ".github/CONTRIBUTING.md"
      - ".github/CODE_OF_CONDUCT.md"
      - ".github/SECURITY.md"
      - ".github/workflows/docs.yml"
  # Run by hand to refresh the site, for example the changelog page after a release.
  workflow_dispatch:

jobs:
  build-python-docs:
    name: "Build Python docs"
    runs-on: ubuntu-latest
    # The Great Docs project (pyproject.toml, great-docs.yml, user_guide/) lives in python/.
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for accurate page timestamps
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"
          python -m pip install git+https://github.com/posit-dev/great-docs.git@main
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
      # `--jobs auto` renders pages in several Quarto processes at once, one per CPU.
      - name: Build docs
        run: great-docs build --jobs auto
      - name: Save docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-docs-html
          path: python/great-docs/_site
          include-hidden-files: true

  build-r-docs:
    name: "Build R docs"
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::pkgdown, local::.
          needs: website
      # The package is already installed, so pkgdown builds from that copy. The site lands in r/docs.
      - name: Build docs
        run: pkgdown::build_site("r", new_process = FALSE, install = FALSE)
        shell: Rscript {0}
      - name: Save docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: r-docs-html
          path: r/docs
          include-hidden-files: true

  publish-docs:
    name: "Publish docs"
    runs-on: ubuntu-latest
    needs: ["build-python-docs", "build-r-docs"]
    if: github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: python-docs-html
          path: site

      # The Python site's r/ holds a stand-in page for the navbar link. The pkgdown site replaces it.
      - name: Remove the R stand-in page
        run: rm -rf site/r

      - uses: actions/download-artifact@v7
        with:
          name: r-docs-html
          path: site/r

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
