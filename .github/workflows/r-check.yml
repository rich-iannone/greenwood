name: R CMD check

# Path filters: a workflow runs only when files it depends on change. spec/ and fixtures/ are shared,
# so they run both packages' checks. main has no required status checks, so a skipped workflow can't
# block a PR. If checks become required, replace these filters with an always-running gate job.
on:
  push:
    branches:
      - main
    paths:
      - "r/**"
      - "spec/**"
      - "fixtures/**"
      - ".github/workflows/r-check.yml"
  pull_request:
    branches:
      - main
    paths:
      - "r/**"
      - "spec/**"
      - "fixtures/**"
      - ".github/workflows/r-check.yml"
  workflow_dispatch:

jobs:
  R-CMD-check:
    # The R package lives in r/. Its tests replay the shared spec/ and fixtures/r/ directories at the
    # repo root, which they find by walking up from the check directory.
    runs-on: ${{ matrix.config.os }}
    name: R CMD check (${{ matrix.config.os }}, R ${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - { os: ubuntu-latest, r: "release" }
          - { os: ubuntu-latest, r: "devel" }
          - { os: ubuntu-latest, r: "oldrel-1" }
          - { os: macos-latest, r: "release" }
          - { os: windows-latest, r: "release" }
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r
          upload-snapshots: true
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
